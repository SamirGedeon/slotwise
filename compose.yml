name: slotwise
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: slotwise
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-slotwise}
      POSTGRES_DB: slotwise_development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slotwise -d slotwise_development"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://slotwise:${POSTGRES_PASSWORD:-slotwise}@db:5432/slotwise_development
      TEST_DATABASE_URL: postgres://slotwise:${POSTGRES_PASSWORD:-slotwise}@db:5432/slotwise_test
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Slotwise-demo-2026!}
      FRONTEND_ORIGIN: http://localhost:5173
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "bundle exec rails db:prepare db:seed && exec bundle exec rails server -b 0.0.0.0"]
    healthcheck:
      test: ["CMD", "ruby", "-rnet/http", "-e", "exit(Net::HTTP.get_response(URI('http://localhost:3000/up')).code == '200' ? 0 : 1)"]
      interval: 5s
      timeout: 3s
      retries: 30
  web:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://api:3000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
